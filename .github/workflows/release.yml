name: Release

# Push a tag equal to "v" + __version__ (e.g. v1.0.0) to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  dist:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          python - <<'PY'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          text = open("src/git_ritual/__init__.py", encoding="utf-8").read()
          version = re.search(r'__version__ = "([^"]+)"', text).group(1)
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match __version__ {version}")
          PY
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*
      - name: Extras (.pyz and universal wheelhouse)
        run: |
          mkdir extras wheelhouse
          python packaging/build_pyz.py
          mv dist/ritual.pyz extras/
          # Pure-Python wheels resolved for the oldest supported Python (3.9): the same
          # folder installs offline on Termux, Linux, macOS and Windows.
          python -m pip download --only-binary=:all: --python-version 3.9 --dest wheelhouse dist/*.whl
          cp dist/*.whl wheelhouse/
          python -m zipfile -c extras/git-ritual-wheelhouse.zip wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: extras
          path: extras/*

  binaries:
    # OPTIONAL standalone binaries. A failure here never blocks PyPI or the release.
    needs: tests
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[bin]"
      - name: Build and smoke-test the binary
        run: python packaging/build_binary.py
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.os }}
          path: dist/bin/*

  pypi:
    needs: dist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/git-ritual/
    permissions:
      id-token: write      # Trusted Publishing (OIDC): no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [dist, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: extras
          path: release
      - uses: actions/download-artifact@v8
        continue-on-error: true      # no binary artifact at all is acceptable
        with:
          pattern: bin-*
          merge-multiple: true
          path: release
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cd ..
          flags=()
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git-Ritual $GITHUB_REF_NAME" \
            --generate-notes --verify-tag "${flags[@]}"
